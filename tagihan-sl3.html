 <meta charset="UTF-8">

    <style>
        body { background-color: #f4f6f9; }
        /* Transisi halus untuk sidebar dan konten utama */
        .sidebar {
            width: 250px; 
            background-color: #1e293b; 
            height: 100vh;
            position: fixed; 
            color: white; 
            padding-top: 20px; 
            z-index: 1000;
            overflow-y: auto;
            transition: width 0.3s ease; /* Transisi lebar sidebar */
        }
        .sidebar a {
            color: #cbd5e1; 
            text-decoration: none; 
            padding: 12px 20px;
            display: flex; /* Diubah ke flex agar ikon & teks rapi saat minimize */
            align-items: center;
            font-weight: 500; 
            transition: 0.3s;
            white-space: nowrap; /* Mencegah teks turun baris saat menyusut */
        }
        .sidebar a span.menu-text {
            transition: opacity 0.2s ease;
        }
        .main-content { 
            margin-left: 250px; 
            padding: 25px 30px; 
            transition: margin-left 0.3s ease; /* Transisi penyesuaian margin konten */
        }

        /* State ketika Sidebar dalam posisi Minimize */
        .sidebar.minimized {
            width: 70px;
        }
        .sidebar.minimized .sidebar-title,
        .sidebar.minimized span.menu-text,
        .sidebar.minimized .fa-chevron-down {
            display: none !important; /* Sembunyikan teks & panah dropdown */
        }
        .sidebar.minimized a {
            justify-content: center;
            padding: 12px 10px;
        }
        .sidebar.minimized a i {
            margin-right: 0 !important;
            font-size: 1.2rem;
        }
        /* Sesuaikan margin konten utama saat sidebar minimized */
        .main-content.expanded {
            margin-left: 70px;
        }

        /* Animasi putar ikon panah dropdown */
        [data-bs-toggle="collapse"] .fa-chevron-down {
            transition: transform 0.3s ease;
        }
        [data-bs-toggle="collapse"][aria-expanded="true"] .fa-chevron-down {
            transform: rotate(180deg);
        }
    </style>
</head>
<body>

<style>

/*=============================
 CARD
==============================*/
.container{
    max-width:550px;
    margin:auto;
    background:#fff;
    padding:30px;
    border-radius:18px;
    box-shadow:
        0 12px 35px rgba(0,0,0,.08),
        0 2px 8px rgba(0,0,0,.05);
}

h3{
    text-align:center;
    color:#0b6b4b;
    margin-bottom:25px;
    letter-spacing:.5px;
}

/*=============================
 INPUT
==============================*/

label{
    font-weight:600;
    color:#444;
}

input[type=text]{
    width:100%;
    box-sizing:border-box;
    padding:12px 15px;
    border-radius:10px;
    border:1px solid #d9d9d9;
    transition:.25s;
    background:#fafafa;
}

input[type=text]:focus{
    border-color:#0aa36c;
    background:#fff;
    box-shadow:0 0 0 4px rgba(10,163,108,.15);
}

/*=============================
 BUTTON
==============================*/

button{
    width:100%;
    margin-top:25px;
    border:none;
    border-radius:12px;
    padding:13px;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;

    background:linear-gradient(
    135deg,
    #00b894,
    #00cec9);

    transition:.25s;
}

button:hover{

transform:translateY(-2px);

box-shadow:0 8px 18px rgba(0,184,148,.35);

}

button:disabled{
background:#ccc;
}

/*=============================
 DOKUMEN
==============================*/

.section-title{

margin-top:18px;
margin-bottom:10px;

font-weight:bold;

color:#0b6b4b;

font-size:15px;

}

.doc-group{

display:flex;

flex-wrap:wrap;

gap:10px;

}

.doc-item input{

display:none;

}

.doc-item span{

display:flex;

align-items:center;

gap:8px;

padding:10px 18px;

border-radius:30px;

background:#f4f4f4;

border:2px solid #ddd;

cursor:pointer;

font-weight:600;

transition:.25s;

user-select:none;

}

.doc-item span:hover{

background:#f0fdf8;

}

.doc-item input:checked + span{

background:linear-gradient(
135deg,
#00b894,
#00cec9);

color:white;

border-color:#00b894;

transform:translateY(-2px);

box-shadow:0 6px 18px rgba(0,184,148,.3);

}

#customNote{

margin-top:12px;

}

/*=============================
 STATUS
==============================*/

#status{

margin-top:18px;

font-weight:bold;

text-align:center;

font-size:15px;

}
</style>
</head>
<body>

<div class="container">
  <h3>EXPEDISI TAGIHAN CPI SALATIGA</h3>

  <label>No PO</label>
  <input type="text" id="po" placeholder="Masukkan nomor PO" required>

  <label>Vendor</label>
  <div style="position: relative;">
    <input type="text" id="vendor" placeholder="Ketik nama vendor..." autocomplete="off">
    <div id="vendorList"></div>
  </div>

   <label>Nominal</label>
<input type="text" id="nominal"
       placeholder="Masukkan nominal"
       required
       oninput="formatNominal(this)">

<label>No Invoice</label>
<input type="text" id="invoice" placeholder="Masukkan nomor invoice">

<div class="section-title">
📂 Dokumen yang disertakan
</div>

<div class="doc-group">

<label class="doc-item">
<input type="checkbox" value="INV">
<span>📄 INV</span>
</label>

<label class="doc-item">
<input type="checkbox" value="SJ">
<span>🚚 SJ</span>
</label>

<label class="doc-item">
<input type="checkbox" value="COPY PO">
<span>📑 COPY PO</span>
</label>

<label class="doc-item">
<input type="checkbox" value="FKTR">
<span>🧾 FKTR</span>
</label>

</div>

<label style="margin-top:18px">
Dokumen lainnya
</label>

<input
type="text"
id="customNote"
placeholder="Contoh : KWITANSI, BAST, COA, dll">

<button id="btnSubmit" onclick="submitData()">Simpan</button>

<div id="status"></div>

<script>
// prefix untuk Salatiga
const PREFIX_PO = "1887";

let vendors = [];
let currentFocus = -1;

// ambil daftar vendor dari Apps Script
google.script.run.withSuccessHandler(data => {
  vendors = data;
}).getVendorList();

// format rupiah
function formatNominal(el) {
  const angka = el.value.replace(/\D/g, '');
  if (!angka) { el.value = ''; return; }
  el.value = 'Rp. ' + parseInt(angka).toLocaleString('id-ID');
}

// submit ke Apps Script
function submitData() {
  const po = document.getElementById('po').value.trim();
  const vendor = document.getElementById('vendor').value.trim();
  const nominalText = document.getElementById('nominal').value.trim();
  const invoice = document.getElementById('invoice').value.trim();
  const list=[];

document.querySelectorAll(
'.doc-item input:checked'
).forEach(c=>{
list.push(c.value);
});

const custom=document
.getElementById("customNote")
.value.trim();

if(custom!=""){
list.push(custom);
}

const note=list.join(", ");
  
  if (!po || !vendor || !nominalText) {
    document.getElementById('status').textContent = '⚠️ Semua field wajib diisi.';
    return;
  }

  if (!po.startsWith(PREFIX_PO)) {
    document.getElementById('status').textContent = 
      `⚠️ Nomor PO untuk SALATIGA harus diawali dengan ${PREFIX_PO}`;
    return;
  }

  const nominal = nominalText.replace(/[^\d]/g, '');
  const btn = document.getElementById('btnSubmit');
  btn.disabled = true;
  document.getElementById('status').textContent = 'Menyimpan data...';

  google.script.run
    .withSuccessHandler(() => {

    document.getElementById("status").textContent =
    "✅ Data berhasil disimpan!";

    setTimeout(() => {
        document.getElementById("status").textContent = "";
        resetForm();
    },1000);

    btn.disabled = false;
    })
    .withFailureHandler(err => {
      document.getElementById('status').textContent = '❌ Gagal: ' + err.message;
      btn.disabled = false;
    })
    .addExpedisiSL3(po, vendor, nominal, invoice, note);
}

/* === Autocomplete sama persis === */
const vendorInput = document.getElementById("vendor");
const vendorListDiv = document.getElementById("vendorList");

vendorInput.addEventListener("input", function () {
  const val = this.value.toLowerCase();
  vendorListDiv.innerHTML = "";
  currentFocus = -1;

  if (!val) { vendorListDiv.style.display = "none"; return; }

  let matches = vendors.filter(v => v.toLowerCase().includes(val));
  if (matches.length === 0) { vendorListDiv.style.display = "none"; return; }

  matches.forEach(match => {
    let item = document.createElement("div");
    item.textContent = match;
    item.addEventListener("click", function () {
      vendorInput.value = match;
      vendorListDiv.style.display = "none";
    });
    vendorListDiv.appendChild(item);
  });

  vendorListDiv.style.width = vendorInput.offsetWidth + "px";
  vendorListDiv.style.top = vendorInput.offsetTop + vendorInput.offsetHeight + "px";
  vendorListDiv.style.left = vendorInput.offsetLeft + "px";
  vendorListDiv.style.display = "block";
});

vendorInput.addEventListener("keydown", function (e) {
  let items = vendorListDiv.getElementsByTagName("div");
  if (e.key === "ArrowDown") { currentFocus++; addActive(items); e.preventDefault(); }
  else if (e.key === "ArrowUp") { currentFocus--; addActive(items); e.preventDefault(); }
  else if (e.key === "Enter") {
    e.preventDefault();
    if (currentFocus > -1 && items[currentFocus]) { items[currentFocus].click(); }
    else { vendorListDiv.style.display = "none"; }
    document.getElementById("nominal").focus();
  }
});

function addActive(items) {
  if (!items) return;
  removeActive(items);
  if (currentFocus >= items.length) currentFocus = 0;
  if (currentFocus < 0) currentFocus = items.length - 1;
  items[currentFocus].style.backgroundColor = "#4CAF50";
  items[currentFocus].style.color = "#fff";
  const containerTop = vendorListDiv.scrollTop;
  const containerBottom = containerTop + vendorListDiv.clientHeight;
  const itemTop = items[currentFocus].offsetTop;
  const itemBottom = itemTop + items[currentFocus].offsetHeight;
  if (itemBottom > containerBottom) vendorListDiv.scrollTop = itemBottom - vendorListDiv.clientHeight;
  else if (itemTop < containerTop) vendorListDiv.scrollTop = itemTop;
}
function removeActive(items) {
  for (let i = 0; i < items.length; i++) {
    items[i].style.backgroundColor = "";
    items[i].style.color = "";
  }
}
document.addEventListener("click", function (e) {
  if (e.target !== vendorInput) { vendorListDiv.style.display = "none"; }
});

// enter untuk next field
document.querySelectorAll('.container input').forEach((input, idx, inputs) => {
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && input.id !== 'vendor') {
      e.preventDefault();
      if (idx < inputs.length - 1) { inputs[idx + 1].focus(); }
      else { submitData(); }
    }
  });
});


function resetForm() {

    // Bersihkan semua textbox
    document.querySelectorAll('.container input[type="text"]')
        .forEach(i => i.value = "");

    // Hilangkan centang semua checkbox
    document.querySelectorAll('.doc-item input[type="checkbox"]')
        .forEach(c => c.checked = false);

    // Bersihkan status
    document.getElementById("status").textContent = "";

    // Fokus kembali ke PO
    document.getElementById("po").focus();
}
</script>

 <!-- TAMBAHKAN SCRIPT BOOTSTRAP DI SINI AGAR DROPDOWN BERFUNGSI -->

</body>
