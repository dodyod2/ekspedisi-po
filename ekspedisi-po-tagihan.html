<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tanda Terima Dokumen PO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-family: Arial, sans-serif; background-color: #f8f9fa; padding: 20px; }
    .card { max-width: 900px; margin: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    .table input { border: 1px solid #ced4da; border-radius: 4px; padding: 4px 8px; width: 100%; }
    @media print {
      .no-print { display: none !important; }
      body { background: white; padding: 0; }
      .card { border: none; box-shadow: none; max-width: 100%; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card p-4">
    <h3 class="text-center mb-4">TANDA TERIMA DOKUMEN PO</h3>

    <form id="formTT">
      <!-- HEADER FORM -->
      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label fw-bold">Nomor TT</label>
          <input type="text" id="nomorTT" class="form-control" readonly>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-bold">Tanggal</label>
          <input type="text" id="tanggal" class="form-control" readonly>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label fw-bold">Tujuan / Penerima</label>
          <select id="tujuan" class="form-select" onchange="onTujuanChange()">
            <option value="">-- Pilih Tujuan --</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-bold">Kepada</label>
          <input type="text" id="kepada" class="form-control">
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label fw-bold">Perusahaan Target</label>
          <input type="text" id="perusahaan" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-bold">Nomor Resi / Pengiriman</label>
          <input type="text" id="resi" class="form-control" placeholder="Contoh: JNE / J&T / Kurir">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Alamat Tujuan</label>
        <textarea id="alamat" class="form-control" rows="2"></textarea>
      </div>

      <hr class="my-4">

      <!-- TABEL PO -->
      <h5 class="mb-3">Daftar PO & Tagihan</h5>
      <table class="table table-bordered align-middle" id="tblPO">
        <thead class="table-light">
          <tr>
            <th style="width: 50px;">No</th>
            <th style="width: 250px;">Nomor PO</th>
            <th style="width: 250px;">Invoice</th>
            <th>Catatan / Note</th>
            <th style="width: 50px;" class="no-print">Aksi</th>
          </tr>
        </thead>
        <tbody id="poTbody">
          <!-- Row akan ditambahkan secara dinamis -->
        </tbody>
      </table>

      <button type="button" class="btn btn-secondary btn-sm no-print mb-3" onclick="addRow()">+ Tambah Baris</button>

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label fw-bold">Pengirim</label>
          <input type="text" id="pengirim" class="form-control">
        </div>
      </div>

      <!-- BUTTON ACTIONS -->
      <div class="d-flex gap-2 no-print mt-4">
        <button type="button" class="btn btn-primary" onclick="simpanData()">Simpan</button>
        <button type="button" class="btn btn-success" onclick="printData()">Cetak</button>
        <button type="button" class="btn btn-outline-danger" onclick="baru()">Reset Form</button>
      </div>
    </form>
  </div>
</div>

<!-- Datalist untuk Autocomplete PO -->
<datalist id="poListOptions"></datalist>

<script>
  // GANTI SCRIPT_URL DENGAN URL DEPLOYMENT WEB APP APPS SCRIPT ANDA
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyHE1bWvCVrFeTl-UNDr3Q6gyhVJPqUqPVI0n5Fk05pOe1fyh8iKwChR0_TVRAe4rw8Sg/exec"; 

  let masterTujuanList = [];
  let masterPOList = [];
  let nomorCounter = 0;

  window.onload = function() {
    loadMasterTujuan();
    loadDefaultData();
    addRow();
  };

  // 1. Ambil Master Tujuan
  function loadMasterTujuan() {
    fetch(`${SCRIPT_URL}?action=getMasterTujuan`)
      .then(res => res.json())
      .then(data => {
        masterTujuanList = data;
        const select = document.getElementById("tujuan");
        select.innerHTML = '<option value="">-- Pilih Tujuan --</option>';
        data.forEach(item => {
          const opt = document.createElement("option");
          opt.value = item.nama;
          opt.textContent = item.nama;
          select.appendChild(opt);
        });
      })
      .catch(err => console.error("Error loading master tujuan:", err));
  }

  // 2. Ambil Default Data Form (Nomor TT, Tanggal, Pengirim)
  function loadDefaultData() {
    fetch(`${SCRIPT_URL}?action=getDefaultData`)
      .then(res => res.json())
      .then(data => {
        document.getElementById("nomorTT").value = data.nomorTT || "";
        document.getElementById("tanggal").value = data.tanggal || "";
        document.getElementById("pengirim").value = data.pengirim || "";
      })
      .catch(err => console.error("Error loading default data:", err));
  }

  // 3. Ketika Tujuan Berubah -> Ambil Daftar PO & Isi Field Otomatis
  function onTujuanChange() {
    const val = document.getElementById("tujuan").value;
    const item = masterTujuanList.find(x => x.nama === val);

    if (item) {
      document.getElementById("kepada").value = item.kepada || "";
      document.getElementById("perusahaan").value = item.perusahaan || "";
      document.getElementById("alamat").value = item.alamat || "";
    } else {
      document.getElementById("kepada").value = "";
      document.getElementById("perusahaan").value = "";
      document.getElementById("alamat").value = "";
    }

    if (!val) {
      masterPOList = [];
      updateDatalistPO();
      return;
    }

    // Fetch Master PO dari Spreadsheet Target
    fetch(`${SCRIPT_URL}?action=getMasterPOByTujuan&tujuan=${encodeURIComponent(val)}`)
      .then(res => res.json())
      .then(data => {
        masterPOList = Array.isArray(data) ? data : [];
        updateDatalistPO();
      })
      .catch(err => console.error("Error loading PO list:", err));
  }

  // 4. Update Opsi Autocomplete PO
  function updateDatalistPO() {
    const dl = document.getElementById("poListOptions");
    dl.innerHTML = "";
    masterPOList.forEach(item => {
      const opt = document.createElement("option");
      opt.value = item.po;
      dl.appendChild(opt);
    });
  }

  // 5. Tambah Baris Tabel
  function addRow() {
    nomorCounter++;
    const tbody = document.getElementById("poTbody");
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td class="text-center row-no">${nomorCounter}</td>
      <td>
        <input type="text" class="input-po" list="poListOptions" placeholder="Ketik/Pilih PO..." oninput="onPOInput(this)">
      </td>
      <td>
        <input type="text" class="input-invoice" placeholder="Nomor Invoice">
      </td>
      <td>
        <input type="text" class="input-note" placeholder="Catatan">
      </td>
      <td class="text-center no-print">
        <button type="button" class="btn btn-sm btn-outline-danger" onclick="removeRow(this)">✕</button>
      </td>
    `;
    tbody.appendChild(tr);
  }

  // 6. Hapus Baris Tabel
  function removeRow(btn) {
    const tr = btn.closest("tr");
    tr.remove();
    reindexRows();
  }

  function reindexRows() {
    const rows = document.querySelectorAll("#poTbody tr");
    nomorCounter = 0;
    rows.forEach((r, idx) => {
      nomorCounter = idx + 1;
      r.querySelector(".row-no").textContent = nomorCounter;
    });
  }

  // 7. Auto-fill Invoice & Note Saat PO Diketik/Dipilih
  function onPOInput(inputEl) {
    const poVal = inputEl.value.trim();
    const tr = inputEl.closest("tr");
    const invInput = tr.querySelector(".input-invoice");
    const noteInput = tr.querySelector(".input-note");

    const match = masterPOList.find(x => String(x.po).trim() === poVal);
    if (match) {
      invInput.value = match.invoice || "";
      noteInput.value = match.note || "";
    }
  }

  // 8. Simpan Data ke Apps Script
  function simpanData() {
    const items = [];
    document.querySelectorAll("#poTbody tr").forEach(tr => {
      const po = tr.querySelector(".input-po").value.trim();
      const invoice = tr.querySelector(".input-invoice").value.trim();
      const note = tr.querySelector(".input-note").value.trim();
      if (po !== "") {
        items.push({ po, invoice, note });
      }
    });

    const payload = {
      action: "saveTTPO",
      payload: {
        nomorTT: document.getElementById("nomorTT").value,
        tanggal: document.getElementById("tanggal").value,
        kepada: document.getElementById("kepada").value,
        perusahaan: document.getElementById("perusahaan").value,
        alamat: document.getElementById("alamat").value,
        resi: document.getElementById("resi").value,
        pengirim: document.getElementById("pengirim").value,
        items: items
      }
    };

    fetch(SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(res => {
      if (res.status) {
        alert("Data berhasil disimpan! Nomor TT: " + res.nomorTT);
      } else {
        alert("Gagal menyimpan data: " + res.message);
      }
    })
    .catch(err => alert("Terjadi kesalahan saat simpan data: " + err));
  }

  // 9. Utility Print & Reset
  function printData() {
    window.print();
  }

  function baru() {
    document.getElementById("formTT").reset();
    document.getElementById("poTbody").innerHTML = "";
    nomorCounter = 0;
    loadDefaultData();
    addRow();
  }
</script>

</body>
</html>
