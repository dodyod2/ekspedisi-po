<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Ekspedisi & PO</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background-color: #f8fafc; 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        
        /* Transisi halus untuk sidebar dan konten utama */
        .sidebar {
            width: 250px; 
            background-color: #1e293b; 
            height: 100vh;
            position: fixed; 
            color: white; 
            padding-top: 20px; 
            z-index: 1000;
            overflow-y: auto;
            transition: width 0.3s ease;
        }
        .sidebar a {
            color: #cbd5e1; 
            text-decoration: none; 
            padding: 12px 20px;
            display: flex;
            align-items: center;
            font-weight: 500; 
            transition: 0.3s;
            white-space: nowrap;
        }
        .sidebar a span.menu-text {
            transition: opacity 0.2s ease;
        }
        .main-content { 
            margin-left: 250px; 
            padding: 30px; 
            transition: margin-left 0.3s ease;
        }

        /* State ketika Sidebar dalam posisi Minimize */
        .sidebar.minimized {
            width: 70px;
        }
        .sidebar.minimized .sidebar-title,
        .sidebar.minimized span.menu-text,
        .sidebar.minimized .fa-chevron-down {
            display: none !important;
        }
        .sidebar.minimized a {
            justify-content: center;
            padding: 12px 10px;
        }
        .sidebar.minimized a i {
            margin-right: 0 !important;
            font-size: 1.2rem;
        }
        .main-content.expanded {
            margin-left: 70px;
        }

        /* Animasi putar ikon panah dropdown */
        [data-bs-toggle="collapse"] .fa-chevron-down {
            transition: transform 0.3s ease;
        }
        [data-bs-toggle="collapse"][aria-expanded="true"] .fa-chevron-down {
            transform: rotate(180deg);
        }

        /*=============================
         CONTAINER & CARD MODERN
        ==============================*/
        .form-card {
            max-width: 650px;
            margin: 0 auto;
            background: #ffffff;
            padding: 35px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.03);
            transition: box-shadow 0.2s ease;
        }
        .form-card:hover {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        h3.form-title {
            text-align: center;
            color: #0b6b4b;
            font-weight: 700;
            margin-bottom: 25px;
            letter-spacing: .5px;
            font-size: 1.4rem;
        }

        /*=============================
         INPUT & FORM CONTROLS
        ==============================*/
        label {
            font-weight: 600;
            color: #334155;
            font-size: 0.9rem;
            margin-bottom: 6px;
        }

        input[type=text] {
            width: 100%;
            box-sizing: border-box;
            padding: 11px 14px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            transition: all 0.2s ease;
            background: #f8fafc;
            font-size: 0.95rem;
        }

        input[type=text]:focus {
            border-color: #0aa36c;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(10,163,108,.12);
            outline: none;
        }

        /*=============================
         BUTTON MODERN
        ==============================*/
        .btn-submit-custom {
            width: 100%;
            margin-top: 25px;
            border: none;
            border-radius: 10px;
            padding: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #00b894, #00cec9);
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(0, 184, 148, 0.2);
        }

        .btn-submit-custom:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(0,184,148,.3);
        }

        .btn-submit-custom:disabled {
            background: #cbd5e1;
            box-shadow: none;
            transform: none;
        }

        /*=============================
         DOKUMEN
        ==============================*/
        .section-title {
            margin-top: 20px;
            margin-bottom: 10px;
            font-weight: 700;
            color: #0b6b4b;
            font-size: 0.95rem;
        }

        .doc-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .doc-item input {
            display: none;
        }

        .doc-item span {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 16px;
            border-radius: 8px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            user-select: none;
            color: #475569;
        }

        .doc-item span:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }

        .doc-item input:checked + span {
            background: linear-gradient(135deg, #00b894, #00cec9);
            color: white;
            border-color: #00b894;
            box-shadow: 0 4px 12px rgba(0,184,148,.2);
        }

        #customNote {
            margin-top: 8px;
        }

        /*=============================
         STATUS
        ==============================*/
        #status {
            margin-top: 15px;
            font-weight: 600;
            text-align: center;
            font-size: 0.95rem;
        }

        /* Autocomplete dropdown styling */
        #vendorList {
            position: absolute;
            border: 1px solid #cbd5e1;
            border-top: none;
            z-index: 99;
            top: 100%;
            left: 0;
            right: 0;
            background: #fff;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            max-height: 200px;
            overflow-y: auto;
        }
        #vendorList div {
            padding: 10px 14px;
            cursor: pointer;
            font-size: 0.9rem;
            border-bottom: 1px solid #f1f5f9;
        }
        #vendorList div:hover {
            background-color: #f1f5f9;
        }
    </style>
</head>
<body>

    <!-- SIDEBAR NAVIGASI -->
    <div class="sidebar">
        <h4 class="text-center fw-bold mb-4 text-white">Ekspedisi<span class="text-primary">Pro</span></h4>
        <a href="index.html"><i class="fa-solid fa-chart-pie me-2"></i> <span class="menu-text">Beranda</span></a>
        <a href="input-po.html"><i class="fa-solid fa-file-invoice me-2"></i> <span class="menu-text">Input PO</span></a>
        
        <!-- Menu Utama Input Tagihan dengan Trigger Dropdown -->
        <a class="d-flex justify-content-between align-items-center text-decoration-none" data-bs-toggle="collapse" href="#subTagihanMenu" role="button" aria-expanded="false" aria-controls="subTagihanMenu">
            <span><i class="fa-solid fa-file-pen me-2"></i> <span class="menu-text">Input Tagihan</span></span>
            <i class="fa-solid fa-chevron-down small"></i>
        </a>

        <!-- Kontainer Dropdown Rincian Tagihan -->
        <div class="collapse show" id="subTagihanMenu">
            <div class="ps-2 py-1 bg-dark bg-opacity-25">
                <a href="tagihan-sl3.html" class="ps-4 py-2 d-block text-white small bg-primary bg-opacity-25 rounded"><i class="fa-solid fa-angle-right me-2"></i> SL3</a>
                <a href="tagihan-pemalang.html" class="ps-4 py-2 d-block text-secondary small"><i class="fa-solid fa-angle-right me-2"></i> Pemalang</a>
                <a href="tagihan-sragen.html" class="ps-4 py-2 d-block text-secondary small"><i class="fa-solid fa-angle-right me-2"></i> Sragen</a>
                <a href="tagihan-banyumas.html" class="ps-4 py-2 d-block text-secondary small"><i class="fa-solid fa-angle-right me-2"></i> Banyumas</a>
                <a href="tagihan-kebumen.html" class="ps-4 py-2 d-block text-secondary small"><i class="fa-solid fa-angle-right me-2"></i> Kebumen</a>
                <a href="tagihan-bisi.html" class="ps-4 py-2 d-block text-secondary small"><i class="fa-solid fa-angle-right me-2"></i> BISI SA</a>
            </div>
        </div>

        <a href="printPO.html" class="mt-2"><i class="fa-solid fa-print me-2"></i> <span class="menu-text">Print Ekspedisi</span></a>
        <a href="searchAll.html"><i class="fa-solid fa-magnifying-glass me-2"></i> <span class="menu-text">Pencarian PO</span></a>
        <a href="ekspedisi-po-tagihan.html"><i class="fa-solid fa-truck-fast me-2"></i> <span class="menu-text">Ekspedisi PO & Tagihan</span></a>
        <a href="tanda-terima-tagihan.html"><i class="fa-solid fa-receipt me-2"></i> <span class="menu-text">Tanda Terima Tagihan</span></a>
    </div>

    <!-- KONTEN UTAMA -->
    <div class="main-content">
        <div class="form-card">
            <h3 class="form-title">EXPEDISI TAGIHAN CPI SALATIGA</h3>

            <div class="mb-3">
                <label>No PO</label>
                <input type="text" id="po" placeholder="Masukkan nomor PO" required>
            </div>

            <div class="mb-3">
                <label>Vendor</label>
                <div style="position: relative;">
                    <input type="text" id="vendor" placeholder="Ketik nama vendor..." autocomplete="off">
                    <div id="vendorList" style="display:none;"></div>
                </div>
            </div>

            <div class="mb-3">
                <label>Nominal</label>
                <input type="text" id="nominal" placeholder="Masukkan nominal" required oninput="formatNominal(this)">
            </div>

            <div class="mb-3">
                <label>No Invoice</label>
                <input type="text" id="invoice" placeholder="Masukkan nomor invoice">
            </div>

            <div class="section-title">
                📂 Dokumen yang disertakan
            </div>

            <div class="doc-group mb-3">
                <label class="doc-item">
                    <input type="checkbox" value="INV">
                    <span>📄 INV</span>
                </label>
                <label class="doc-item">
                    <input type="checkbox" value="SJ">
                    <span>🚚 SJ</span>
                </label>
                <label class="doc-item">
                    <input type="checkbox" value="COPY PO">
                    <span>📑 COPY PO</span>
                </label>
                <label class="doc-item">
                    <input type="checkbox" value="FKTR">
                    <span>🧾 FKTR</span>
                </label>
            </div>

            <div class="mb-3">
                <label>Dokumen lainnya</label>
                <input type="text" id="customNote" placeholder="Contoh : KWITANSI, BAST, COA, dll">
            </div>

            <button id="btnSubmit" class="btn-submit-custom" onclick="submitData()">Simpan Data</button>

            <div id="status"></div>
        </div>
    </div>

<script>
// prefix untuk Salatiga
const PREFIX_PO = "1887";

// Ganti URL di bawah ini dengan URL Web App Apps Script Anda yang berakhiran /exec
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzmWFS_nAV1WAuB34-v6Mnh5aev8y8QIi3vrzHJ7w7IACDvghBGGP_n-dztlleDlo5A/exec";

let vendors = [];
let currentFocus = -1;

// Ambil daftar vendor dari Web App Apps Script
fetch(SCRIPT_URL, {
  method: "POST",
  body: JSON.stringify({ action: "getVendorList" })
})
.then(res => res.json())
.then(result => {
  if (result.status === "success") {
    vendors = result.data;
  }
})
.catch(err => console.error("Gagal memuat vendor:", err));

// Format rupiah (tetap sama)
function formatNominal(el) {
  const angka = el.value.replace(/\D/g, '');
  if (!angka) { el.value = ''; return; }
  el.value = 'Rp. ' + parseInt(angka).toLocaleString('id-ID');
}

// Submit data ke Web App Apps Script via Fetch
function submitData() {
  const po = document.getElementById('po').value.trim();
  const vendor = document.getElementById('vendor').value.trim();
  const nominalText = document.getElementById('nominal').value.trim();
  const invoice = document.getElementById('invoice').value.trim();
  const list=[];

  document.querySelectorAll('.doc-item input:checked').forEach(c=>{
    list.push(c.value);
  });

  const custom = document.getElementById("customNote").value.trim();
  if(custom !== ""){
    list.push(custom);
  }

  const note = list.join(", ");
  
  if (!po || !vendor || !nominalText) {
    document.getElementById('status').textContent = '⚠️ Semua field wajib diisi.';
    document.getElementById('status').style.color = '#dc2626';
    return;
  }

  if (!po.startsWith("1887")) {
    document.getElementById('status').textContent = `⚠️ Nomor PO untuk SALATIGA harus diawali dengan 1887`;
    document.getElementById('status').style.color = '#dc2626';
    return;
  }

  const nominal = nominalText.replace(/[^\d]/g, '');
  const btn = document.getElementById('btnSubmit');
  btn.disabled = true;
  document.getElementById('status').textContent = 'Menyimpan data...';
  document.getElementById('status').style.color = '#0b6b4b';

  // Kirim data menggunakan fetch ke Apps Script
  fetch(SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "addExpedisiSL3",
      po: po,
      vendor: vendor,
      nominal: nominal,
      invoice: invoice,
      note: note
    })
  })
  .then(res => res.json())
  .then(result => {
    if (result.status === "success") {
      document.getElementById("status").textContent = "✅ Data berhasil disimpan!";
      document.getElementById("status").style.color = '#0b6b4b';

      setTimeout(() => {
          document.getElementById("status").textContent = "";
          resetForm();
      }, 1000);
    } else {
      throw new Error(result.message || "Gagal menyimpan");
    }
    btn.disabled = false;
  })
  .catch(err => {
    document.getElementById('status').textContent = '❌ Gagal: ' + err.message;
    document.getElementById('status').style.color = '#dc2626';
    btn.disabled = false;
  });
}

/* === Autocomplete === */
const vendorInput = document.getElementById("vendor");
const vendorListDiv = document.getElementById("vendorList");

vendorInput.addEventListener("input", function () {
  const val = this.value.toLowerCase();
  vendorListDiv.innerHTML = "";
  currentFocus = -1;

  if (!val) { vendorListDiv.style.display = "none"; return; }

  let matches = vendors.filter(v => v.toLowerCase().includes(val));
  if (matches.length === 0) { vendorListDiv.style.display = "none"; return; }

  matches.forEach(match => {
    let item = document.createElement("div");
    item.textContent = match;
    item.addEventListener("click", function () {
      vendorInput.value = match;
      vendorListDiv.style.display = "none";
    });
    vendorListDiv.appendChild(item);
  });

  vendorListDiv.style.display = "block";
});

vendorInput.addEventListener("keydown", function (e) {
  let items = vendorListDiv.getElementsByTagName("div");
  if (e.key === "ArrowDown") { currentFocus++; addActive(items); e.preventDefault(); }
  else if (e.key === "ArrowUp") { currentFocus--; addActive(items); e.preventDefault(); }
  else if (e.key === "Enter") {
    e.preventDefault();
    if (currentFocus > -1 && items[currentFocus]) { items[currentFocus].click(); }
    else { vendorListDiv.style.display = "none"; }
    document.getElementById("nominal").focus();
  }
});

function addActive(items) {
  if (!items) return;
  removeActive(items);
  if (currentFocus >= items.length) currentFocus = 0;
  if (currentFocus < 0) currentFocus = items.length - 1;
  items[currentFocus].style.backgroundColor = "#e2e8f0";
  items[currentFocus].style.color = "#0f172a";
}
function removeActive(items) {
  for (let i = 0; i < items.length; i++) {
    items[i].style.backgroundColor = "";
    items[i].style.color = "";
  }
}
document.addEventListener("click", function (e) {
  if (e.target !== vendorInput) { vendorListDiv.style.display = "none"; }
});

// enter untuk next field
document.querySelectorAll('.form-card input').forEach((input, idx, inputs) => {
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && input.id !== 'vendor') {
      e.preventDefault();
      if (idx < inputs.length - 1) { inputs[idx + 1].focus(); }
      else { submitData(); }
    }
  });
});

function resetForm() {
    document.querySelectorAll('.form-card input[type="text"]').forEach(i => i.value = "");
    document.querySelectorAll('.doc-item input[type="checkbox"]').forEach(c => c.checked = false);
    document.getElementById("status").textContent = "";
    document.getElementById("po").focus();
}
</script>

<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
