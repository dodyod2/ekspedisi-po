<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>Daftar PO CPI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f5f7;
      color: #222;
    }

    /* =====================================================
       FORM
    ===================================================== */
    .screen-area {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
    }

    .screen-card {
      background: white;
      border-radius: 14px;
      padding: 25px 30px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.10);
    }

    .screen-title {
      text-align: center;
      color: #087f5b;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .filter {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field label {
      font-size: 14px;
      font-weight: bold;
    }

    input[type="date"], select {
      width: 170px;
      height: 42px;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      background-color: #fff;
    }

    button {
      border: none;
      border-radius: 8px;
      height: 42px;
      padding: 0 20px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-load {
      background: #00a878;
      color: white;
    }

    .btn-load:hover {
      background: #008f67;
    }

    .btn-print {
      background: #666;
      color: white;
    }

    .btn-print:hover:not(:disabled) {
      background: #444;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* =====================================================
       LOADING
    ===================================================== */
    #loading {
      display: none;
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      color: #087f5b;
    }

    .spinner {
      width: 22px;
      height: 22px;
      margin: 0 auto 8px auto;
      border: 3px solid #ddd;
      border-top: 3px solid #087f5b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    /* =====================================================
       AREA PRINT
    ===================================================== */
    .print-area {
      background: white;
      width: 100%;
      max-width: 850px;
      margin: 25px auto 0 auto;
      padding: 15px;
      border-radius: 8px;
    }

    .daftar-title {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin: 0 0 3px 0;
      color: #087f5b;
    }

    .print-date {
      text-align: center;
      font-size: 11px;
      margin-bottom: 10px;
    }

    #printContainer {
      width: 100%;
    }

    .print-page {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 15px;
    }

    .po-block {
      width: calc(50% - 5px);
    }

    /* =====================================================
       TABEL
    ===================================================== */
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th {
      background: #087f5b;
      color: white;
      border: 1px solid #087f5b;
      font-size: 10px;
      font-weight: bold;
      height: 24px;
      padding: 3px 4px;
      text-align: center;
    }

    td {
      border: 1px solid #999;
      height: 24px;
      padding: 3px 4px;
      font-size: 10px;
      vertical-align: middle;
    }

    th:nth-child(1), td:nth-child(1) {
      width: 27%;
      text-align: center;
      white-space: nowrap;
    }

    th:nth-child(2), td:nth-child(2) {
      width: 48%;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: clip;
    }

    th:nth-child(3), td:nth-child(3) {
      width: 25%;
      text-align: center;
    }

    .no-data {
      text-align: center !important;
      font-size: 13px;
      padding: 15px;
      color: #777;
    }

    /* =====================================================
       PRINT MEDIA STYLES
    ===================================================== */
    @page {
      size: A4 portrait;
      margin: 7mm;
    }

    @media print {
      html, body {
        margin: 0 !important;
        padding: 0 !important;
        width: 100%;
        background: white !important;
      }

      .screen-area {
        display: none !important;
      }

      .print-area {
        display: block !important;
        width: 100% !important;
        max-width: none !important;
        margin: 0 !important;
        padding: 0 !important;
        background: white !important;
        border-radius: 0 !important;
      }

      .daftar-title {
        color: #000 !important;
        font-size: 20px !important;
        margin-top: 0 !important;
        margin-bottom: 2px !important;
      }

      .print-date {
        font-size: 13px !important;
        margin-bottom: 6px !important;
      }

      #printContainer {
        width: 100% !important;
      }

      .print-page table {
        width: 100% !important;
        border-collapse: collapse !important;
        table-layout: fixed !important;
        box-sizing: border-box !important;
      }

      th, td {
        box-sizing: border-box !important;
      }

      th {
        background: #555 !important;
        color: white !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
        font-size: 12px !important;
        height: 20px !important;
        padding: 2px 3px !important;
        border: 0.5px solid #444 !important;
      }

      td {
        font-size: 12px !important;
        height: 21px !important;
        padding: 2px 3px !important;
        border: 0.5px solid #777 !important;
      }

      th:nth-child(1), td:nth-child(1) {
        width: 25% !important;
        border-right: 0.5px solid #777 !important;
      }

      th:nth-child(2), td:nth-child(2) {
        width: 49% !important;
        white-space: nowrap !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
        padding-right: 4px !important;
        border-right: 0.5px solid #777 !important;
      }

      th:nth-child(3), td:nth-child(3) {
        width: 26% !important;
        border-right: 0.5px solid #777 !important;
      }

      tr {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
    }
  </style>
</head>

<body>

  <div class="screen-area">
    <div class="screen-card">
      <div class="screen-title" id="titleHeader">PRINT ekspedisi PO CPI</div>

      <div class="filter">
        <!-- Pilihan Lokasi KM8 / KM9 -->
        <div class="field">
          <label for="pilihanKM">Lokasi / Sheet</label>
          <select id="pilihanKM" onchange="updateTitle()">
            <option value="CPI KM8">CPI KM8</option>
            <option value="CPI KM9">CPI KM9</option>
          </select>
        </div>

        <!-- Tanggal Naik -->
        <div class="field">
          <label for="tanggal">Tanggal Naik</label>
          <input type="date" id="tanggal">
        </div>

        <button class="btn-load" id="btnLoad" onclick="loadData()">Tampilkan</button>
        <button class="btn-print" id="btnPrint" onclick="printData()" disabled>🖨️ PRINT</button>
      </div>

      <div id="loading">
        <div class="spinner"></div>
        <div>Sedang menampilkan data PO...</div>
      </div>
    </div>
  </div>

  <div class="print-area" id="printArea">
    <h2 class="daftar-title" id="printTitle">DAFTAR PO CPI KM8</h2>

    <div class="print-date">
      Tanggal Naik: <span id="printTanggal"></span>
    </div>

    <div id="printContainer">
      <!-- Tabel akan dirender dinamis di sini -->
    </div>
  </div>

  <script>
    function updateTitle() {
      const sheetName = document.getElementById("pilihanKM").value;
      document.getElementById("titleHeader").textContent = "PRINT PO " + sheetName;
      document.getElementById("printTitle").textContent = "DAFTAR PO " + sheetName;
    }

    function formatTanggal(tanggal) {
      if (!tanggal) return "";
      const p = tanggal.split("-");
      if (p.length !== 3) return tanggal;
      return p[2] + "-" + p[1] + "-" + p[0];
    }

    function escapeHtml(value) {
      if (value === null || value === undefined) return "";
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function loadData() {
      const sheetName = document.getElementById("pilihanKM").value;
      const tanggal = document.getElementById("tanggal").value;

      if (!tanggal) {
        alert("Silakan pilih tanggal naik.");
        return;
      }

      // Update Judul Sesuai Pilihan
      updateTitle();

      document.getElementById("loading").style.display = "block";
      document.getElementById("btnLoad").disabled = true;
      document.getElementById("btnPrint").disabled = true;
      document.getElementById("printContainer").innerHTML = "";
      document.getElementById("printTanggal").textContent = "";

      google.script.run
        .withSuccessHandler(function(data) {
          document.getElementById("loading").style.display = "none";
          document.getElementById("btnLoad").disabled = false;

          const container = document.getElementById("printContainer");
          container.innerHTML = "";

          if (!data || data.length === 0) {
            container.innerHTML = `<div class="no-data">Tidak ada PO pada tanggal tersebut.</div>`;
            document.getElementById("btnPrint").disabled = true;
            document.getElementById("printTanggal").textContent = formatTanggal(tanggal);
            return;
          }

          data.sort(function(a, b) {
            const vendorA = String(a.vendor || "").trim().toUpperCase();
            const vendorB = String(b.vendor || "").trim().toUpperCase();
            return vendorA.localeCompare(vendorB, "id", { sensitivity: "base" });
          });

          document.getElementById("printTanggal").textContent = formatTanggal(tanggal);

          const MAX_PER_BLOCK = 40;
          for (let i = 0; i < data.length; i += MAX_PER_BLOCK) {
            const chunk = data.slice(i, i + MAX_PER_BLOCK);
            const blockIndex = Math.floor(i / MAX_PER_BLOCK);

            if (blockIndex % 2 === 0) {
              const page = document.createElement("div");
              page.className = "print-page";
              page.id = "print-page-" + blockIndex;
              container.appendChild(page);
            }

            const pages = container.querySelectorAll(".print-page");
            const currentPage = pages[pages.length - 1];

            const block = document.createElement("div");
            block.className = "po-block";

            let html = `
              <table>
                <thead>
                  <tr>
                    <th>PO</th>
                    <th>Nama Vendor</th>
                    <th>Penerima</th>
                  </tr>
                </thead>
                <tbody>
            `;

            chunk.forEach(function(item) {
              html += `
                <tr>
                  <td>${escapeHtml(item.po)}</td>
                  <td>${escapeHtml(item.vendor)}</td>
                  <td></td>
                </tr>
              `;
            });

            html += `
                </tbody>
              </table>
            `;

            block.innerHTML = html;
            currentPage.appendChild(block);
          }

          document.getElementById("btnPrint").disabled = false;
        })
        .withFailureHandler(function(error) {
          document.getElementById("loading").style.display = "none";
          document.getElementById("btnLoad").disabled = false;
          document.getElementById("btnPrint").disabled = true;
          alert("Gagal mengambil data: " + (error.message || error));
        })
        .getDataPrintPO(sheetName, tanggal); // Dinamis mengirimkan pilihan CPI KM8 / CPI KM9
    }

    window.addEventListener("DOMContentLoaded", function() {
  const urlParams = new URLSearchParams(window.location.search);
  const sheet = urlParams.get("sheet");
  const tanggal = urlParams.get("tanggal");

  if (sheet && tanggal) {
    document.getElementById("pilihanKM").value = sheet;
    document.getElementById("tanggal").value = tanggal;
    loadData(); // Otomatis muat data PO begitu halaman terbuka
  }
});

    function printData() {
      const container = document.getElementById("printContainer");
      if (!container || container.innerHTML.trim() === "") {
        alert("Data belum ditampilkan.");
        return;
      }
      window.print();
    }

    document.addEventListener("keydown", function(event) {
      if (event.key === "Enter" && document.activeElement.id === "tanggal") {
        loadData();
      }
    });
  </script>
</body>
</html>
