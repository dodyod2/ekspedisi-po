<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tanda Terima Dokumen PO</title>

  <!-- SweetAlert2 untuk Notifikasi -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Calibri, Arial, sans-serif;
      background: #f5f7fa;
      padding: 20px;
      color: #333;
    }

    .container {
      background: #FFF;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .15);
      max-width: 1000px;
      margin: auto;
    }

    .title {
      text-align: center;
      margin-bottom: 20px;
    }

    .title h2 {
      color: #1565C0;
      font-size: 24px;
      font-weight: bold;
    }

    /* ===========================
       HEADER FORM
       =========================== */
    .header {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 15px;
    }

    .header td {
      border: none;
      padding: 6px;
      vertical-align: middle;
    }

    .header input,
    .header select,
    .header textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #CCC;
      border-radius: 5px;
      font-size: 13px;
      transition: .2s;
    }

    .header textarea {
      resize: vertical;
    }

    .header input:focus,
    .header select:focus,
    .header textarea:focus {
      outline: none;
      border: 1px solid #2196F3;
      box-shadow: 0 0 5px rgba(33, 150, 243, .4);
    }

    input[readonly] {
      background: #ECEFF1;
      font-weight: bold;
    }

    /* ===========================
       TABLE DATA PO
       =========================== */
    #tblPO {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    #tblPO thead th {
      background: #1565C0;
      color: white;
      padding: 10px;
      border: 1px solid #0D47A1;
      text-align: center;
    }

    #tblPO td {
      border: 1px solid #DDD;
      padding: 4px;
    }

    #tblPO input {
      width: 100%;
      border: none;
      padding: 6px;
    }

    #tblPO input:focus {
      outline: none;
      background: #FFF9C4;
    }

    #tblPO th:nth-child(1),
    #tblPO td:nth-child(1) {
      width: 55px;
      text-align: center;
    }

    #tblPO th:nth-child(2),
    #tblPO td:nth-child(2) {
      width: 250px;
    }

    #tblPO th:nth-child(3),
    #tblPO td:nth-child(3) {
      width: 250px;
    }

    #tblPO th:nth-child(4),
    #tblPO td:nth-child(4) {
      width: auto;
    }

    #tblPO th:nth-child(5),
    #tblPO td:nth-child(5) {
      width: 80px;
      text-align: center;
    }

    /* ===========================
       BUTTONS
       =========================== */
    .toolbar {
      margin-top: 15px;
      text-align: center;
    }

    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      color: white;
      font-size: 14px;
      margin: 4px;
      transition: .2s;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-add { background: #4CAF50; }
    .btn-save { background: #2196F3; }
    .btn-print { background: #FB8C00; }
    .btn-reset { background: #757575; }

    .btn-delete {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto;
      border: none;
      border-radius: 50%;
      background: #E53935;
      color: #FFF;
      cursor: pointer;
      font-size: 18px;
      font-weight: bold;
      padding: 0;
    }

    .btn-delete:hover {
      background: #B71C1C;
    }

    /* ===========================
       RESPONSIVE & PRINT
       =========================== */
    @media screen and (max-width: 900px) {
      .header td {
        display: block;
        width: 100%;
      }
      .btn {
        width: 100%;
        margin-top: 8px;
      }
    }

    @media print {
      .toolbar { display: none; }
      body { background: white; padding: 0; }
      .container { box-shadow: none; padding: 0; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="title">
    <h2>TANDA TERIMA DOKUMEN PO</h2>
  </div>

  <!-- Header Form -->
  <table class="header">
    <tr>
      <td width="15%"><strong>Nomor TT</strong></td>
      <td width="35%"><input type="text" id="nomorTT" readonly></td>
      <td width="15%"><strong>Tanggal</strong></td>
      <td width="35%"><input type="text" id="tanggal" readonly></td>
    </tr>
    <tr>
      <td><strong>Pilih Tujuan</strong></td>
      <td>
        <select id="tujuan" onchange="pilihTujuan()">
          <option value="">-- Pilih Tujuan --</option>
        </select>
      </td>
      <td><strong>Pengirim</strong></td>
      <td><input type="text" id="pengirim"></td>
    </tr>
    <tr>
      <td><strong>Kepada</strong></td>
      <td><input type="text" id="kepada" readonly></td>
      <td><strong>Perusahaan</strong></td>
      <td><input type="text" id="perusahaan" readonly></td>
    </tr>
    <tr>
      <td><strong>Alamat</strong></td>
      <td><textarea id="alamat" rows="3" readonly></textarea></td>
      <td><strong>No. Resi</strong></td>
      <td style="vertical-align: top;"><input type="text" id="resi" placeholder="Masukkan No. Resi Expedisi"></td>
    </tr>
  </table>

  <!-- Datalist Autocomplete PO -->
  <datalist id="listPO"></datalist>

  <!-- Table PO -->
  <table id="tblPO">
    <thead>
      <tr>
        <th>NO</th>
        <th>NOMOR PO</th>
        <th>INVOICE</th>
        <th>NOTE</th>
        <th>AKSI</th>
      </tr>
    </thead>
    <tbody>
      <!-- Baris Dinamis Ditambahkan Lewat JS -->
    </tbody>
  </table>

  <!-- Toolbar Tombol -->
  <div class="toolbar">
    <button class="btn btn-add" onclick="addRow()">+ Tambah Baris</button>
    <button class="btn btn-save" onclick="saveData()">💾 Simpan Data</button>
    <button class="btn btn-print" onclick="printData()">🖨️ Cetak / Print</button>
    <button class="btn btn-reset" onclick="baru()">🔄 Form Baru</button>
  </div>
</div>

<script>
  // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyiiFZ-w5PY_rKHjQDeoDLLa740cBCrlJ12EO5pR2kIFFewGyTXAAGHfr7oHJ2mLizW9g/exec";

  let masterTujuan = [];
  let nomor = 0;
  let masterPO = [];

  /*==================================================
  LOAD AWAL
  ==================================================*/
  window.onload = function () {
    fetch(`${SCRIPT_URL}?action=getDefaultData`)
      .then(res => res.json())
      .then(data => loadDefault(data))
      .catch(err => console.error("Gagal load default:", err));

    fetch(`${SCRIPT_URL}?action=getMasterTujuan`)
      .then(res => res.json())
      .then(data => loadMasterTujuan(data))
      .catch(err => console.error("Gagal load master tujuan:", err));

    addRow();
    document.getElementById("tujuan").focus();
  };

  function loadDefault(data) {
    document.getElementById("tanggal").value = data.tanggal || "";
    document.getElementById("pengirim").value = data.pengirim || "";
    document.getElementById("perusahaan").value = data.perusahaan || "";
    document.getElementById("nomorTT").value = data.nomorTT || "";
  }

  function loadMasterTujuan(data) {
    masterTujuan = data;
    const cmb = document.getElementById("tujuan");
    cmb.innerHTML = '<option value="">-- Pilih Tujuan --</option>';

    data.forEach(function (r) {
      const opt = document.createElement("option");
      opt.value = r.nama;
      opt.textContent = r.nama;
      cmb.appendChild(opt);
    });
  }

  /*==================================================
  PILIH TUJUAN & MASTER PO
  ==================================================*/
  function pilihTujuan() {
    const tujuan = document.getElementById("tujuan").value;
    const obj = masterTujuan.find(r => r.nama === tujuan);

    if (!obj) return;

    document.getElementById("kepada").value = obj.kepada;
    document.getElementById("perusahaan").value = obj.perusahaan;
    document.getElementById("alamat").value = obj.alamat;

    fetch(`${SCRIPT_URL}?action=getMasterPOByTujuan&tujuan=${encodeURIComponent(tujuan)}`)
      .then(res => res.json())
      .then(data => loadMasterPO(data))
      .catch(err => {
        Swal.fire({ icon: "error", title: "Gagal", text: err.message });
      });
  }

  function loadMasterPO(data) {
    masterPO = data;
    const dl = document.getElementById("listPO");
    if (!dl) return;

    dl.innerHTML = "";
    data.forEach(function (r) {
      const opt = document.createElement("option");
      opt.value = r.po;
      dl.appendChild(opt);
    });
  }

  /*==================================================
  TAMBAH & HAPUS BARIS
  ==================================================*/
  function addRow() {
    nomor++;
    const tbody = document.querySelector("#tblPO tbody");
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td align="center">${nomor}</td>
      <td>
        <input type="text" class="po" onkeydown="enterPO(event,this)" list="listPO" onblur="isiPO(this)">
      </td>
      <td>
        <input type="text" class="invoice" readonly>
      </td>
      <td>
        <input type="text" class="note">
      </td>
      <td align="center">
        <button type="button" class="btn-delete" onclick="hapusBaris(this)">✖</button>
      </td>
    `;

    tbody.appendChild(tr);
    pasangNavigasi();
  }

  function hapusBaris(btn) {
    btn.closest("tr").remove();
    urutkan();
  }

  function urutkan() {
    nomor = 0;
    document.querySelectorAll("#tblPO tbody tr").forEach(function (r) {
      nomor++;
      r.cells[0].innerHTML = nomor;
    });
  }

  /*==================================================
  NAVIGASI & FETCH DATA PO
  ==================================================*/
  function pasangNavigasi() {
    const rows = document.querySelectorAll("#tblPO tbody tr");
    rows.forEach(function (row) {
      const inv = row.querySelector(".invoice");
      const note = row.querySelector(".note");

      inv.onkeydown = function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          note.focus();
        }
      };

      note.onkeydown = function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          const next = row.nextElementSibling;
          if (next) {
            next.querySelector(".po").focus();
          } else {
            addRow();
            document.querySelector("#tblPO tbody tr:last-child .po").focus();
          }
        }
      };
    });
  }

  function isiPO(obj) {
    const po = obj.value.trim();
    if (po == "") return;

    const row = obj.closest("tr");
    const tujuan = document.getElementById("tujuan").value;

    fetch(`${SCRIPT_URL}?action=getDataPO&tujuan=${encodeURIComponent(tujuan)}&nomorPO=${encodeURIComponent(po)}`)
      .then(res => res.json())
      .then(data => {
        row.querySelector(".invoice").value = data.invoice || "";
        row.querySelector(".note").value = data.note || "";
      })
      .catch(err => console.error("Gagal get data PO:", err));
  }

  function enterPO(e, obj) {
    if (e.key !== "Enter") return;
    e.preventDefault();

    const po = obj.value.trim();
    if (po == "") return;

    const row = obj.closest("tr");
    const tujuan = document.getElementById("tujuan").value;

    fetch(`${SCRIPT_URL}?action=getDataPO&tujuan=${encodeURIComponent(tujuan)}&nomorPO=${encodeURIComponent(po)}`)
      .then(res => res.json())
      .then(data => {
        row.querySelector(".invoice").value = data.invoice || "";
        row.querySelector(".note").value = data.note || "";

        const next = row.nextElementSibling;
        if (next) {
          next.querySelector(".po").focus();
        } else {
          addRow();
          document.querySelector("#tblPO tbody tr:last-child .po").focus();
        }
      })
      .catch(err => console.error("Error PO Enter:", err));
  }

  /*==================================================
  VALIDASI & SIMPAN
  ==================================================*/
  function validasi() {
    if (document.getElementById("kepada").value == "") {
      Swal.fire({
        icon: "warning",
        title: "Data Belum Lengkap",
        text: "Pilih tujuan terlebih dahulu."
      });
      return false;
    }

    if (document.getElementById("resi").value == "") {
      Swal.fire({
        icon: "warning",
        title: "Data Belum Lengkap",
        text: "Nomor Resi belum diisi."
      });
      return false;
    }

    return true;
  }

  function saveData() {
    if (!validasi()) return;

    const rows = document.querySelectorAll("#tblPO tbody tr");
    const items = [];

    rows.forEach(function (r) {
      const po = r.querySelector(".po").value.trim();
      if (po == "") return;

      items.push({
        po: po,
        invoice: r.querySelector(".invoice").value,
        note: r.querySelector(".note").value
      });
    });

    if (items.length == 0) {
      Swal.fire({
        icon: "warning",
        title: "Data Belum Lengkap",
        text: "Belum ada PO yang diinput."
      });
      return;
    }

    const payload = {
      nomorTT: document.getElementById("nomorTT").value,
      tanggal: document.getElementById("tanggal").value,
      kepada: document.getElementById("kepada").value,
      perusahaan: document.getElementById("perusahaan").value,
      alamat: document.getElementById("alamat").value,
      resi: document.getElementById("resi").value,
      pengirim: document.getElementById("pengirim").value,
      items: items
    };

    Swal.fire({
      title: "Menyimpan Data...",
      allowOutsideClick: false,
      didOpen: () => Swal.showLoading()
    });

    fetch(SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "saveTTPO", payload: payload })
    })
      .then(res => res.json())
      .then(res => {
        if (res.status) {
          Swal.fire({
            icon: "success",
            title: "Berhasil",
            text: "Data berhasil disimpan."
          }).then(() => {
            fetch(`${SCRIPT_URL}?action=getDefaultData`)
              .then(r => r.json())
              .then(data => loadDefault(data));
          });
        } else {
          throw new Error(res.message || "Gagal menyimpan");
        }
      })
      .catch(err => {
        Swal.fire({
          icon: "error",
          title: "Gagal",
          text: err.message
        });
      });
  }

  /*==================================================
  PRINT & BARU
  ==================================================*/
  function printData() {
    window.print();
  }

  function baru() {
    document.getElementById("tujuan").selectedIndex = 0;
    document.getElementById("kepada").value = "";
    document.getElementById("alamat").value = "";
    document.getElementById("resi").value = "";

    fetch(`${SCRIPT_URL}?action=getDefaultData`)
      .then(res => res.json())
      .then(data => loadDefault(data));

    const tbody = document.querySelector("#tblPO tbody");
    tbody.innerHTML = "";
    nomor = 0;

    addRow();
    document.getElementById("tujuan").focus();
  }
</script>
</body>
</html>
