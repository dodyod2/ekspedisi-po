<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expedisi Tagihan CPI Salatiga</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .card-custom {
      max-width: 650px;
      margin: 40px auto;
      border: none;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      background: #ffffff;
      padding: 30px;
    }
    .title {
      color: #0f766e;
      font-weight: 700;
      text-align: center;
      margin-bottom: 25px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-label {
      font-weight: 600;
      color: #334155;
      font-size: 0.9rem;
    }
    .form-control {
      border-radius: 8px;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
    }
    .form-control:focus {
      border-color: #0d9488;
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
    }
    /* Style Autocomplete Vendor */
    .autocomplete-wrapper {
      position: relative;
    }
    .autocomplete-items {
      position: absolute;
      border: 1px solid #cbd5e1;
      border-top: none;
      z-index: 99;
      top: 100%;
      left: 0;
      right: 0;
      background-color: #fff;
      border-radius: 0 0 8px 8px;
      max-height: 200px;
      overflow-y: auto;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      display: none;
    }
    .autocomplete-items div {
      padding: 10px 14px;
      cursor: pointer;
    }
    .autocomplete-items div:hover {
      background-color: #f1f5f9;
      color: #0f766e;
    }
    .btn-submit {
      background-color: #0d9488;
      color: white;
      font-weight: 600;
      padding: 12px;
      border-radius: 8px;
      border: none;
      width: 100%;
      margin-top: 15px;
      transition: all 0.2s;
    }
    .btn-submit:hover {
      background-color: #0f766e;
    }
    .doc-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn-check:checked + .btn-outline-secondary {
      background-color: #e2e8f0;
      color: #0f172a;
      border-color: #94a3b8;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card card-custom">
    <h4 class="title">Expedisi Tagihan CPI Salatiga</h4>
    <form id="expedisiForm">
      
      <!-- No PO -->
      <div class="mb-3">
        <label for="noPo" class="form-label">No PO</label>
        <input type="text" class="form-control" id="noPo" placeholder="1887010000" required>
      </div>

      <!-- Vendor (Autocomplete) -->
      <div class="mb-3 autocomplete-wrapper">
        <label for="vendor" class="form-label">Vendor</label>
        <input type="text" class="form-control" id="vendor" placeholder="Ketik nama vendor..." autocomplete="off" required>
        <div id="vendorList" class="autocomplete-items"></div>
      </div>

      <!-- Nominal -->
      <div class="mb-3">
        <label for="nominal" class="form-label">Nominal</label>
        <input type="text" class="form-control" id="nominal" placeholder="Masukkan nominal" required>
      </div>

      <!-- No Invoice -->
      <div class="mb-3">
        <label for="noInvoice" class="form-label">No Invoice</label>
        <input type="text" class="form-control" id="noInvoice" placeholder="Masukkan nomor invoice" required>
      </div>

      <!-- Dokumen Lampiran -->
      <div class="mb-3">
        <label class="form-label">📁 Dokumen yang disertakan</label>
        <div class="doc-group">
          <input type="checkbox" class="btn-check" id="doc_inv" value="INV" checked autocomplete="off">
          <label class="btn btn-outline-secondary btn-sm" for="doc_inv">📄 INV</label>

          <input type="checkbox" class="btn-check" id="doc_sj" value="SJ" autocomplete="off">
          <label class="btn btn-outline-secondary btn-sm" for="doc_sj">🚚 SJ</label>

          <input type="checkbox" class="btn-check" id="doc_po" value="COPY PO" autocomplete="off">
          <label class="btn btn-outline-secondary btn-sm" for="doc_po">📄 COPY PO</label>

          <input type="checkbox" class="btn-check" id="doc_fktr" value="FKTR" autocomplete="off">
          <label class="btn btn-outline-secondary btn-sm" for="doc_fktr">📑 FKTR</label>
        </div>
      </div>

      <!-- Dokumen Lainnya -->
      <div class="mb-3">
        <label for="customNote" class="form-label">Dokumen lainnya</label>
        <input type="text" class="form-control" id="customNote" placeholder="Contoh : KWITANSI, BAST, COA, dll">
      </div>

      <button type="submit" class="btn-submit" id="btnSimpan">Simpan Data</button>
    </form>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwqS2kGjJmCAt_O3c613e51a661642131971238917238917/exec"; // Sesuaikan jika ada perubahan URL Web App
  let vendors = [];
  let currentFocus = -1;

  // 1. Ambil data vendor secara otomatis saat halaman dimuat (Menggunakan GET)
  function loadVendors() {
    fetch(`${SCRIPT_URL}?action=getVendorList`)
      .then(res => res.json())
      .then(result => {
        if (result.status === "success" && Array.isArray(result.data)) {
          vendors = result.data;
          console.log("Vendor berhasil dimuat:", vendors.length, "vendor");
        }
      })
      .catch(err => console.error("Gagal memuat daftar vendor:", err));
  }

  document.addEventListener("DOMContentLoaded", loadVendors);

  // 2. Fitur Autocomplete Vendor
  const vendorInput = document.getElementById("vendor");
  const vendorListDiv = document.getElementById("vendorList");

  vendorInput.addEventListener("input", function () {
    const val = this.value.toLowerCase().trim();
    vendorListDiv.innerHTML = "";
    currentFocus = -1;

    if (!val) { 
      vendorListDiv.style.display = "none"; 
      return; 
    }

    let matches = vendors.filter(v => v.toLowerCase().includes(val));

    if (matches.length === 0) { 
      vendorListDiv.style.display = "none"; 
      return; 
    }

    matches.forEach(match => {
      let item = document.createElement("div");
      item.textContent = match;
      
      item.addEventListener("click", function () {
        vendorInput.value = match;
        vendorListDiv.style.display = "none";
        document.getElementById("nominal").focus();
      });
      
      vendorListDiv.appendChild(item);
    });

    vendorListDiv.style.display = "block";
  });

  // Navigasi Keyboard untuk Dropdown Vendor
  vendorInput.addEventListener("keydown", function (e) {
    let items = vendorListDiv.getElementsByTagName("div");
    if (e.key === "ArrowDown") { 
      currentFocus++; 
      setActive(items); 
      e.preventDefault(); 
    } else if (e.key === "ArrowUp") { 
      currentFocus--; 
      setActive(items); 
      e.preventDefault(); 
    } else if (e.key === "Enter") {
      e.preventDefault();
      if (currentFocus > -1 && items[currentFocus]) { 
        items[currentFocus].click(); 
      } else { 
        vendorListDiv.style.display = "none"; 
        document.getElementById("nominal").focus();
      }
    }
  });

  function setActive(items) {
    if (!items || items.length === 0) return;
    for (let i = 0; i < items.length; i++) {
      items[i].style.backgroundColor = "";
      items[i].style.color = "";
    }
    if (currentFocus >= items.length) currentFocus = 0;
    if (currentFocus < 0) currentFocus = items.length - 1;
    items[currentFocus].style.backgroundColor = "#f1f5f9";
    items[currentFocus].style.color = "#0f766e";
  }

  document.addEventListener("click", function (e) {
    if (e.target !== vendorInput) { 
      vendorListDiv.style.display = "none"; 
    }
  });

  // 3. Format Nominal Rupiah saat mengetik
  const nominalInput = document.getElementById("nominal");
  nominalInput.addEventListener("input", function (e) {
    let value = this.value.replace(/\D/g, "");
    if (value) {
      this.value = "Rp. " + parseInt(value, 10).toLocaleString("id-ID");
    } else {
      this.value = "";
    }
  });

  // 4. Navigasi Tombol Enter Antar Form
  document.getElementById("noPo").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      e.preventDefault();
      if (!this.value.startsWith("1887")) {
        alert("Nomor PO untuk Salatiga harus diawali dengan 1887");
        return;
      }
      vendorInput.focus();
    }
  });

  document.getElementById("nominal").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      e.preventDefault();
      document.getElementById("noInvoice").focus();
    }
  });

  document.getElementById("noInvoice").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      e.preventDefault();
      document.getElementById("customNote").focus();
    }
  });

  // 5. Submit Form
  document.getElementById("expedisiForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const noPo = document.getElementById("noPo").value.trim();
    if (!noPo.startsWith("1887")) {
      alert("Nomor PO untuk Salatiga harus diawali dengan 1887");
      return;
    }

    // Menggabungkan pilihan dokumen lampiran
    let docs = [];
    if (document.getElementById("doc_inv").checked) docs.push("INV");
    if (document.getElementById("doc_sj").checked) docs.push("SJ");
    if (document.getElementById("doc_po").checked) docs.push("COPY PO");
    if (document.getElementById("doc_fktr").checked) docs.push("FKTR");

    let customNote = document.getElementById("customNote").value.trim();
    if (customNote) docs.push(customNote);

    const formData = {
      action: "simpanData",
      cabang: "Salatiga",
      noPo: noPo,
      vendor: vendorInput.value.trim(),
      nominal: nominalInput.value.trim(),
      noInvoice: document.getElementById("noInvoice").value.trim(),
      note: docs.join(", ")
    };

    const btnSimpan = document.getElementById("btnSimpan");
    btnSimpan.disabled = true;
    btnSimpan.textContent = "Menyimpan...";

    fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify(formData)
    })
    .then(res => res.json())
    .then(data => {
      alert("Data berhasil disimpan!");
      document.getElementById("expedisiForm").reset();
      document.getElementById("doc_inv").checked = true; // reset ke default
    })
    .catch(err => {
      console.error(err);
      alert("Gagal menyimpan data.");
    })
    .finally(() => {
      btnSimpan.disabled = false;
      btnSimpan.textContent = "Simpan Data";
    });
  });
</script>

</body>
</html>
