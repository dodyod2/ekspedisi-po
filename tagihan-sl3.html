  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <style>
    body { 
      background-color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #334155;
    }
    
    /* SIDEBAR STYLES (TETAP) */
    .sidebar {
      width: 250px; 
      background-color: #1e293b; 
      height: 100vh;
      position: fixed; 
      color: white; 
      padding-top: 20px; 
      z-index: 1000;
      overflow-y: auto;
    }
    .sidebar a {
      color: #cbd5e1; 
      text-decoration: none; 
      padding: 12px 20px;
      display: flex;
      align-items: center;
      font-weight: 500; 
      transition: 0.3s;
      white-space: nowrap;
    }
    .sidebar a:hover, .sidebar a.active {
      background-color: #334155;
      color: #fff;
    }

    /* MAIN CONTENT MODERN STYLES */
    .main-content { 
      margin-left: 250px; 
      padding: 40px 30px; 
    }

    .form-card-modern {
      background: #ffffff;
      border-radius: 20px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05), 0 8px 10px -6px rgba(15, 23, 42, 0.03);
      padding: 40px;
      transition: all 0.3s ease;
    }

    .form-header {
      border-bottom: 2px dashed #f1f5f9;
      padding-bottom: 20px;
      margin-bottom: 28px;
    }

    .form-header h4 {
      color: #0d9488;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .input-group-modern {
      position: relative;
    }

    .input-group-modern .input-group-text {
      background-color: #f8fafc;
      border-color: #cbd5e1;
      border-right: none;
      color: #64748b;
      border-top-left-radius: 10px;
      border-bottom-left-radius: 10px;
      padding-left: 16px;
    }

    .input-group-modern .form-control {
      background-color: #f8fafc;
      border-color: #cbd5e1;
      border-left: none;
      border-top-right-radius: 10px;
      border-bottom-right-radius: 10px;
      padding: 11px 16px;
      font-weight: 500;
      color: #1e293b;
      transition: all 0.2s ease;
    }

    .input-group-modern .form-control:focus {
      background-color: #ffffff;
      border-color: #0d9488;
      box-shadow: none;
    }

    .input-group-modern:focus-within .input-group-text {
      background-color: #ffffff;
      border-color: #0d9488;
      color: #0d9488;
    }

    /* MODERN CHECKBOX BADGES */
    .doc-checkbox {
      display: none;
    }

    .doc-label {
      cursor: pointer;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 0.875rem;
      font-weight: 600;
      color: #64748b;
      background-color: #f8fafc;
      transition: all 0.2s ease;
      user-select: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .doc-label:hover {
      background-color: #f1f5f9;
      border-color: #cbd5e1;
      color: #334155;
    }

    .doc-checkbox:checked + .doc-label {
      background-color: #ccfbf1;
      border-color: #0d9488;
      color: #0f766e;
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.15);
    }

    /* SUBMIT BUTTON MODERN */
    .btn-submit-modern {
      background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-weight: 700;
      letter-spacing: 0.3px;
      box-shadow: 0 10px 20px -5px rgba(13, 148, 136, 0.4);
      transition: all 0.25s ease;
    }

    .btn-submit-modern:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -3px rgba(13, 148, 136, 0.5);
      background: linear-gradient(135deg, #0f766e 0%, #115e59 100%);
    }

    .btn-submit-modern:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- SIDEBAR NAVIGASI -->
    <div class="sidebar">
        <h4 class="text-center fw-bold mb-4 text-white">Ekspedisi<span class="text-primary">Pro</span></h4>
        <a href="index.html"><i class="fa-solid fa-chart-pie me-2"></i> <span class="menu-text">Beranda</span></a>
        <a href="input-po.html"><i class="fa-solid fa-file-invoice me-2"></i> <span class="menu-text">Input PO</span></a>
        
        <!-- Menu Utama Input Tagihan dengan Trigger Dropdown -->
        <a class="d-flex justify-content-between align-items-center text-decoration-none" data-bs-toggle="collapse" href="#subTagihanMenu" role="button" aria-expanded="false" aria-controls="subTagihanMenu">
            <span><i class="fa-solid fa-file-pen me-2"></i> <span class="menu-text">Input Tagihan</span></span>
            <i class="fa-solid fa-chevron-down small"></i>
        </a>

        <!-- Kontainer Dropdown Rincian Tagihan -->
        <div class="collapse show" id="subTagihanMenu">
            <div class="ps-2 py-1 bg-dark bg-opacity-25">
                <a href="tagihan-sl3.html" class="ps-4 py-2 d-block text-white small bg-primary bg-opacity-25 rounded"><i class="fa-solid fa-angle-right me-2"></i> Salatiga</a>
                <a href="tagihan-pemalang.html" class="ps-4 py-2 d-block text-secondary small"><i class="fa-solid fa-angle-right me-2"></i> Pemalang</a>
                <a href="tagihan-sragen.html" class="ps-4 py-2 d-block text-secondary small"><i class="fa-solid fa-angle-right me-2"></i> Sragen</a>
                <a href="tagihan-banyumas.html" class="ps-4 py-2 d-block text-secondary small"><i class="fa-solid fa-angle-right me-2"></i> Banyumas</a>
                <a href="tagihan-kebumen.html" class="ps-4 py-2 d-block text-secondary small"><i class="fa-solid fa-angle-right me-2"></i> Kebumen</a>
                <a href="tagihan-bisi.html" class="ps-4 py-2 d-block text-secondary small"><i class="fa-solid fa-angle-right me-2"></i> BISI SA</a>
            </div>
        </div>

        <a href="printPO.html" class="mt-2"><i class="fa-solid fa-print me-2"></i> <span class="menu-text">Print Ekspedisi</span></a>
        <a href="searchAll.html"><i class="fa-solid fa-magnifying-glass me-2"></i> <span class="menu-text">Pencarian PO</span></a>
        <a href="ekspedisi-po-tagihan.html"><i class="fa-solid fa-truck-fast me-2"></i> <span class="menu-text">Ekspedisi PO & Tagihan</span></a>
        <a href="tanda-terima-tagihan.html"><i class="fa-solid fa-receipt me-2"></i> <span class="menu-text">Tanda Terima Tagihan</span></a>
    </div>


  <!-- MAIN CONTENT (DIUPDATE LEBIH MODERN) -->
  <div class="main-content">
    <div class="row justify-content-center">
      <div class="col-lg-7 col-md-10">
        <div class="form-card-modern">
          
          <div class="form-header text-center">
            <div class="d-inline-flex align-items-center justify-content-center bg-teal-subtle text-teal rounded-circle mb-2" style="width: 48px; height: 48px; background-color: #ccfbf1; color: #0d9488;">
              <i class="fa-solid fa-file-invoice-dollar fs-4"></i>
            </div>
            <h4 class="mb-1">EXPEDISI TAGIHAN CPI SALATIGA</h4>
            <p class="text-muted small mb-0">Kelola dan catat formulir penagihan ekpedisi secara presisi</p>
          </div>
          
          <form id="formTagihan">
            <!-- No PO -->
            <div class="mb-3">
              <label for="noPo" class="form-label text-dark small fw-bold mb-1">No PO</label>
              <div class="input-group input-group-modern">
                <span class="input-group-text"><i class="fa-solid fa-hashtag"></i></span>
                <input type="text" class="form-control" id="noPo" placeholder="Masukkan nomor PO" required>
              </div>
            </div>

            <!-- Vendor / Expedisi -->
            <div class="mb-3">
              <label for="vendor" class="form-label text-dark small fw-bold mb-1">Vendor </label>
              <div class="input-group input-group-modern">
               <span class="input-group-text"><i class="fa-solid fa-building"></i></span>
                <input type="text" class="form-control" id="vendor" list="vendorDatalist" placeholder="Pilih / ketik vendor..." autocomplete="off" required>
              </div>
            </div>

            <!-- Nominal -->
            <div class="mb-3">
              <label for="nominal" class="form-label text-dark small fw-bold mb-1">Nominal</label>
              <div class="input-group input-group-modern">
                <span class="input-group-text"><i class="fa-solid fa-money-bill-wave"></i></span>
                <input type="text" class="form-control" id="nominal" placeholder="Rp. 0" required>
              </div>
            </div>

            <!-- No Invoice -->
            <div class="mb-3">
              <label for="noInvoice" class="form-label text-dark small fw-bold mb-1">No Invoice</label>
              <div class="input-group input-group-modern">
                <span class="input-group-text"><i class="fa-solid fa-receipt"></i></span>
                <input type="text" class="form-control" id="noInvoice" placeholder="Masukkan nomor invoice">
              </div>
            </div>

            <!-- Dokumen yang disertakan -->
            <div class="mb-3">
              <label class="form-label text-dark small fw-bold d-block mb-2"><i class="fa-regular fa-folder-open me-1 text-teal" style="color: #0d9488;"></i> Dokumen yang disertakan</label>
              <div class="d-flex flex-wrap gap-2">
                <input type="checkbox" class="doc-checkbox" id="docInv" value="INV">
                <label class="doc-label" for="docInv"><i class="fa-solid fa-file-invoice"></i> INV</label>

                <input type="checkbox" class="doc-checkbox" id="docSj" value="SJ">
                <label class="doc-label" for="docSj"><i class="fa-solid fa-truck-ramp-box"></i> SJ</label>

                <input type="checkbox" class="doc-checkbox" id="docPo" value="COPY PO">
                <label class="doc-label" for="docPo"><i class="fa-solid fa-file-lines"></i> COPY PO</label>

                <input type="checkbox" class="doc-checkbox" id="docFktr" value="FKTR">
                <label class="doc-label" for="docFktr"><i class="fa-solid fa-receipt"></i> FKTR</label>
              </div>
            </div>

            <!-- Dokumen lainnya -->
            <div class="mb-4">
              <label for="docLainnya" class="form-label text-dark small fw-bold mb-1">Dokumen lainnya</label>
              <div class="input-group input-group-modern">
                <span class="input-group-text"><i class="fa-solid fa-paperclip"></i></span>
                <input type="text" class="form-control" id="docLainnya" placeholder="Contoh: KWITANSI, BAST, COA, dll">
              </div>
            </div>

            <!-- Tombol Simpan -->
            <button type="button" id="btnSimpan" class="btn btn-submit-modern w-100 text-white mt-2" onclick="simpanData()">
              <i class="fa-solid fa-floppy-disk me-2"></i> Simpan Data Tagihan
            </button>
          </form>

        </div>
      </div>
    </div>
  </div>

  <!-- WADAH DATALIST AUTOCOMPLETE (TETAP) -->
  <datalist id="vendorDatalist"></datalist>

  <!-- BOOTSTRAP JS (TETAP) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JAVASCRIPT LOGIC (TETAP) -->
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzF_Ej51qZn6q2Q4pqdXobNLbKmh7_71PITKxuBzekGocbGEsGpw-xqy0l_m64CCNWT/exec";

    document.addEventListener("DOMContentLoaded", function () {
      loadVendorList();
      setupEnterNavigation();
      setupNominalFormat();
    });

    // 1. Memuat daftar vendor ke datalist
    function loadVendorList() {
      fetch(`${SCRIPT_URL}?action=getVendorList`)
        .then(res => res.json())
        .then(res => {
          if (res.status === 'success' && Array.isArray(res.data)) {
            const datalist = document.getElementById('vendorDatalist');
            datalist.innerHTML = '';
            res.data.forEach(v => {
              const option = document.createElement('option');
              option.value = v;
              datalist.appendChild(option);
            });
          }
        })
        .catch(err => console.error("Gagal memuat vendor:", err));
    }

    // 2. NAVIGASI ENTER PINDAH KE INPUT BAWAHNYA
    function setupEnterNavigation() {
      const inputs = [
        document.getElementById("noPo"),
        document.getElementById("vendor"),
        document.getElementById("nominal"),
        document.getElementById("noInvoice"),
        document.getElementById("docLainnya")
      ];

      inputs.forEach((input, index) => {
        if (!input) return;

        input.addEventListener("keydown", function (event) {
          if (event.key === "Enter") {
            event.preventDefault(); // Matikan submit default

            // Pindah ke elemen berikutnya
            const nextInput = inputs[index + 1];
            if (nextInput) {
              if (input.id === "vendor") {
                input.blur(); // Tutup dropdown datalist vendor
              }
              setTimeout(() => {
                nextInput.focus();
                if (nextInput.select) nextInput.select();
              }, 50);
            } else {
              // Jika sudah di input terakhir, jalankan simpan data
              simpanData();
            }
          }
        });

        // Khusus Vendor: Pindah ke Nominal saat opsi datalist diklik
        if (input.id === "vendor") {
          input.addEventListener("change", function () {
            if (this.value.trim() !== "") {
              setTimeout(() => {
                document.getElementById("nominal").focus();
              }, 50);
            }
          });
        }
      });
    }

    // 3. Format Rupiah pada Input Nominal
    function setupNominalFormat() {
      const nominalInput = document.getElementById("nominal");
      if (!nominalInput) return;

      nominalInput.addEventListener("input", function () {
        let value = this.value.replace(/[^,\d]/g, "");
        if (value) {
          let numberValue = parseInt(value, 10);
          this.value = "Rp. " + numberValue.toLocaleString("id-ID");
        } else {
          this.value = "";
        }
      });
    }

    // 4. Simpan Data Tagihan
    function simpanData() {
  const noPo = document.getElementById("noPo").value.trim();
  const vendor = document.getElementById("vendor").value.trim();
  const nominal = document.getElementById("nominal").value.trim();
  const noInvoice = document.getElementById("noInvoice").value.trim();
  const docLainnya = document.getElementById("docLainnya").value.trim();

  // Ambil semua dokumen yang dicentang
  const docCheckboxes = document.querySelectorAll(".doc-checkbox:checked");
  let docs = Array.from(docCheckboxes).map(cb => cb.value);
  if (docLainnya) docs.push(docLainnya);

  // Validasi Input Wajib
  if (!noPo || !vendor || !nominal) {
    Swal.fire('Peringatan', 'Harap isi No PO, Vendor, dan Nominal!', 'warning');
    return;
  }

  Swal.fire({
    title: 'Menyimpan...',
    allowOutsideClick: false,
    didOpen: () => Swal.showLoading()
  });

  // Payload disesuaikan dengan fungsi addExpedisiSL3 di Code.gs
  const payload = {
    action: "addExpedisiSL3",      // Action sesuai backend
    po: noPo,                      // Menggunakan 'po'
    vendor: vendor,                // Menggunakan 'vendor'
    nominal: nominal,              // Menggunakan 'nominal'
    invoice: noInvoice,            // Menggunakan 'invoice'
    note: docs.join(", ")          // Menggunakan 'note' untuk daftar dokumen
  };

  fetch(SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify(payload)
  })
  .then(res => res.json())
  .then(res => {
    if (res.status === 'success') {
      Swal.fire('Berhasil!', 'Data tagihan berhasil disimpan.', 'success');
      document.getElementById("formTagihan").reset();
      document.getElementById("noPo").focus();
    } else {
      Swal.fire('Gagal', res.message || 'Gagal menyimpan data.', 'error');
    }
  })
  .catch(err => {
    console.error(err);
    Swal.fire('Error', 'Terjadi kesalahan sistem saat menyimpan data.', 'error');
  });
}
  </script>
</body>
