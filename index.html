<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ekspedisi Tagihan CPI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f4f6f9;
    }
    .container {
      max-width: 450px;
      background: #ffffff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }
    select, input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    #pesan {
      margin-top: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Input Data Tagihan CPI</h2>
    <form id="cpiForm">
      
      <!-- Pilihan Wilayah Ekspedisi -->
      <div class="form-group">
        <label for="wilayah">Wilayah Ekspedisi:</label>
        <select id="wilayah" required>
          <option value="">-- Pilih Wilayah --</option>
          <option value="Salatiga">Salatiga</option>
          <option value="Sragen">Sragen</option>
          <option value="Pemalang">Pemalang</option>
          <option value="Banyumas">Banyumas</option>
          <option value="Kebumen">Kebumen</option>
          <option value="BISI SA">BISI SA</option>
        </select>
      </div>

      <!-- Input Nomor PO -->
      <div class="form-group">
        <label for="nomorPO">Nomor PO:</label>
        <input type="text" id="nomorPO" placeholder="Masukkan nomor PO..." required>
      </div>

      <button type="submit" id="btnSimpan">Simpan Data</button>
    </form>

    <div id="pesan"></div>
  </div>

  <script>
    // 1. Pemetaan prefix nomor PO berdasarkan wilayah ekspedisi
    const poPrefixMapping = {
      "Salatiga": "1887",
      "Sragen": "3247",
      "Pemalang": "3237",
      "Banyumas": "3027",
      "Kebumen": "3027",
      "BISI SA": "1156"
    };

    const form = document.getElementById("cpiForm");
    const wilayahSelect = document.getElementById("wilayah");
    const nomorPOInput = document.getElementById("nomorPO");
    const pesanDiv = document.getElementById("pesan");

    // 2. Logika saat form dikirim
    form.addEventListener("submit", function(e) {
      e.preventDefault();

      const wilayah = wilayahSelect.value;
      const nomorPO = nomorPOInput.value.trim();
      const expectedPrefix = poPrefixMapping[wilayah];

      pesanDiv.innerText = "";

      // 3. Validasi awalan (prefix) nomor PO
      if (!nomorPO.startsWith(expectedPrefix)) {
        pesanDiv.style.color = "red";
        pesanDiv.innerText = `❌ Gagal: Nomor PO untuk wilayah ${wilayah} harus diawali dengan angka ${expectedPrefix}.`;
        return; // Hentikan proses jika tidak valid
      }

      // Jika valid, lanjutkan proses (misal dikirim ke Google Sheets / Database / API Vercel)
      pesanDiv.style.color = "green";
      pesanDiv.innerText = `✅ Sukses! Nomor PO valid untuk wilayah ${wilayah}. Data siap disimpan.`;

      // Contoh jika Anda ingin mengirim data ke backend/API endpoint Anda:
      /*
      fetch('/api/save-data', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ wilayah, nomorPO })
      }).then(res => res.json()).then(data => {
        console.log('Berhasil disimpan', data);
      });
      */
    });
  </script>

</body>
</html>
